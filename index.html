<!DOCTYPE html>
<html lang="Zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不努力時間有限管理局</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="hero">    
        <p class="eyebrow">本週營業中</p>
        <h1>不努力時間有限管理局</h1>
        <p class="quote">本週金句：不努力那就躺平吧!</p>
        <button id="refreshBtn" type="button">
        重新整理資料
    </button>
        <div class="week-range">
        <span>本週期間</span>
        <time datetime="2026-05-04">2026/05/04</time>
        <span>～</span>
        <time datetime="2026-05-10">2026/05/10</time>
    </div>
        </header>

        <section class="progress-card">
            <h2>本週進度</h2>

            <div class="progress-list">
                <p>
                <span>本週任務</span>
                <strong id="taskProgress">1 / 2</strong>
                </p>

                <p>
                <span>完成標準</span>
                <strong id="standardProgress">0 / 2</strong>
                </p>
            </div>
        </section>

        <section class="task-section">
            <div class="section-header">
                <h2>本週任務</h2>
                </div>

                <div class="add-form">
                <input id="taskInput" type="text" placeholder="輸入本週任務，例如：練習 CSS Flex" />
                <button id="addTaskBtn" class="add-btn" type="button">新增</button>
                </div>

    <ul class="item-list" id="taskList">
  <!-- 之後本週任務會由 JavaScript 自動產生 -->
</ul>
    </section>
        <section class="standard-section">
            <div class="section-header">
                <h2>完成標準</h2>
  </div>

  <div class="add-form">
    <input id="standardInput" type="text" placeholder="輸入完成標準，例如：可以說明今天學到什麼" />
    <button id="addStandardBtn" class="add-btn" type="button">新增</button>
  </div>

  <ul class="item-list" id="standardList">
    <!-- 之後完成標準會由 JavaScript 自動產生 -->
  </ul>
</section>
</main>
</body>
</html>

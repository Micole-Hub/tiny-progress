<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tiny Progress</title>

  <link rel="icon" href="App-icon.png" />
  <link rel="stylesheet" href="style.css?v=20260523-freecodecamp-lock-1" />
  <script src="script.js?v=20260523-freecodecamp-lock-1" defer></script>
  </head>

<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">本週小櫃台值班中</p>

      <h1>Tiny Progress</h1>

      <p class="quote" id="dailyQuote">
        本日金句：今日有學，即可記上一筆。
      </p>

      <button id="refreshBtn" class="refresh-btn" type="button">
        重新整理案件板
      </button>

      <div class="week-range">
        <span>本週期間</span>
        <time id="weekStartText" datetime="">讀取中</time>
        <span>～</span>
        <time id="weekEndText" datetime="">讀取中</time>
      </div>
    </header>

    <section class="plan-card" aria-labelledby="planTitle">
      <div class="section-header">
        <div>
          <p class="plan-label">12 週前端學習計畫</p>

          <h2 id="planTitle">
            第 <span id="currentWeekNumber">-</span> / 12 週
          </h2>

          <p class="section-note" id="planStatusText">
            讀取週次資料中...
          </p>
        </div>
      </div>

      <div class="week-tabs" aria-label="週次切換">
        <button
          id="previousWeekTab"
          class="week-tab"
          type="button"
          data-week-view="previous"
        >
          已結案
        </button>

        <button
          id="currentWeekTab"
          class="week-tab is-active"
          type="button"
          data-week-view="current"
        >
          本週
        </button>

        <button
          id="nextWeekTab"
          class="week-tab"
          type="button"
          data-week-view="next"
        >
          下週
        </button>
      </div>

      <div class="plan-content">
        <p class="plan-kicker" id="selectedWeekLabel">
          本週主題
        </p>

        <h3 id="selectedWeekTitle">
          讀取中
        </h3>

        <div class="achievement-box">
          <span>本週達成</span>
          <p id="selectedWeekAchievement">
            讀取中
          </p>
        </div>
      </div>

      <button id="completeWeekBtn" class="complete-week-btn" type="button">
        本週結案，進入下一週
      </button>
    </section>

    <section class="progress-card">
      <div class="section-header">
        <div>
          <h2 id="progressTitle">本週進度</h2>
          <p class="section-note" id="progressNote">
            本局只記本週靠近了哪裡，不翻舊帳。
          </p>
        </div>
      </div>

      <div class="progress-list">
        <div class="progress-item">
          <div class="progress-row">
            <span id="taskProgressLabel">本週任務</span>
            <strong id="taskProgress">0 / 0</strong>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="本週任務完成進度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-fill" id="taskProgressFill"></div>
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-row">
            <span id="standardProgressLabel">本週驗收標準</span>
            <strong id="standardProgress">0 / 0</strong>
          </div>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="本週驗收標準完成進度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-fill" id="standardProgressFill"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="task-section">
      <div class="section-header">
        <div>
          <h2 id="taskSectionTitle">本週任務</h2>
          <p class="section-note" id="taskSectionNote">
            本局會依分類排好，陪你一件一件辦。
          </p>
        </div>
      </div>

      <div class="add-form task-add-form">
        <input
          id="taskInput"
          type="text"
          placeholder="立一個小案件，例如：練習 CSS Flex"
        />

        <select id="taskCategory" aria-label="任務分類">
          <option value="程式學習">程式學習</option>
          <option value="身心穩定">身心穩定</option>
          <option value="興趣探索">興趣探索</option>
        </select>

        <select id="taskSubCategory" class="task-subcategory-control" aria-label="程式學習子分類">
          <option value="觀看課程影片">觀看課程影片</option>
          <option value="練習">練習</option>
          <option value="寫筆記">寫筆記</option>
          <option value="W3Schools">W3Schools</option>
          <option value="freeCodeCamp">freeCodeCamp</option>
        </select>

        <select id="taskDifficulty" aria-label="任務難度">
          <option value="簡單">簡單</option>
          <option value="適中">適中</option>
          <option value="困難">困難</option>
        </select>

        <button id="addTaskBtn" class="add-btn" type="button">
          新增
        </button>
      </div>

      <ul class="item-list" id="taskList">
        <!-- 任務會由 JavaScript 自動產生 -->
      </ul>
    </section>

    <section class="standard-section">
      <div class="section-header">
        <div>
          <h2 id="standardSectionTitle">本週驗收標準</h2>
          <p class="section-note" id="standardSectionNote">
            這不是拿來責備自己，而是看見本週靠近了哪裡。
          </p>
        </div>
      </div>

      <div class="add-form">
        <input
          id="standardInput"
          type="text"
          placeholder="寫一個本週想靠近的方向，例如：本週能說明一個學到的觀念"
        />

        <button id="addStandardBtn" class="add-btn" type="button">
          新增
        </button>
      </div>

      <ul class="item-list" id="standardList">
        <!-- 驗收標準會由 JavaScript 自動產生 -->
      </ul>
    </section>
  </main>
</body>
</html>
